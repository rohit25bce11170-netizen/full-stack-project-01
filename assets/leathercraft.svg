<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="100%" height="100%">
  <rect width="400" height="225" fill="#F2F0EA"/>
  <!-- Leather hide cut piece -->
  <rect x="80" y="45" width="180" height="120" rx="8" fill="#8A6B56"/>
  <!-- Stitching line dashes -->
  <line x1="90" y1="55" x2="250" y2="55" stroke="#F4EFEB" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="90" y1="155" x2="250" y2="155" stroke="#F4EFEB" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="90" y1="55" x2="90" y2="155" stroke="#F4EFEB" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="250" y1="55" x2="250" y2="155" stroke="#F4EFEB" stroke-width="2" stroke-dasharray="5,4"/>
  <!-- Brass hardware clasp -->
  <circle cx="170" cy="105" r="16" fill="#D4AF37"/>
  <circle cx="170" cy="105" r="10" fill="#8A6B56"/>
  <!-- Awl / stitching punch tool -->
  <line x1="280" y1="170" x2="330" y2="80" stroke="#2B2825" stroke-width="5" stroke-linecap="round"/>
  <polygon points="325,75 338,70 342,85" fill="#E2DDD5"/>
</svg>
