  <path d="M 150 60 Q 110 100 150 160 Q 190 100 150 60 Z" fill="#1F5A67"/>
  <path d="M 150 70 L 150 150" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 150 95 L 130 85 M 150 115 L 170 105 M 150 135 L 135 125" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Ink brayer roller -->
  <rect x="250" y="70" width="85" height="25" rx="4" fill="#2B2825"/>
  <rect x="285" y="95" width="15" height="70" rx="3" fill="#A5856F"/>
  <path d="M 270 70 L 270 95 M 315 70 L 315 95" stroke="#68625C" stroke-width="3"/>
