  <rect x="25" y="965" width="370" height="290" fill="#F4F4F4" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="40" y="995" class="wire-title" font-size="14">Quick Reservation / Studio Inquiry</text>
  <text x="40" y="1015" class="wire-muted">Reserve your seat or ask instructor about custom dates.</text>

  <text x="40" y="1040" class="wire-text" font-size="11">Full Name *</text>
  <rect x="40" y="1047" width="340" height="28" fill="#FFF" stroke="#666" rx="3"/>

  <text x="40" y="1092" class="wire-text" font-size="11">Email Address *</text>
  <rect x="40" y="1099" width="340" height="28" fill="#FFF" stroke="#666" rx="3"/>

  <text x="40" y="1144" class="wire-text" font-size="11">Select Workshop & Attendees</text>
  <rect x="40" y="1151" width="340" height="28" fill="#FFF" stroke="#666" rx="3"/>
  <text x="50" y="1169" class="wire-muted">Ceramic Wheel Throwing (1 Guest) ▼</text>

  <rect x="40" y="1195" width="340" height="36" class="wire-btn" fill="#333"/>
  <text x="210" y="1218" text-anchor="middle" fill="#FFF" font-family="sans-serif" font-weight="bold" font-size="12">Submit Reservation</text>

  <!-- ================= FOOTER ================= -->
  <rect x="25" y="1270" width="370" height="220" fill="#2B2825" stroke="#111" stroke-width="1"/>
  <text x="40" y="1305" fill="#FFF" class="wire-title">ArtisanCraft Studio</text>
  <text x="40" y="1325" fill="#AAA" class="wire-muted">Cultivating analog craft mastery in a digital age.</text>
  
  <text x="40" y="1360" fill="#DDD" font-size="11" font-weight="bold">Explore Links</text>
  <text x="40" y="1380" fill="#AAA" font-size="10">• Ceramics &amp; Pottery</text>
  <text x="40" y="1398" fill="#AAA" font-size="10">• Wood Joinery</text>
  <text x="40" y="1416" fill="#AAA" font-size="10">• Printmaking &amp; Linocut</text>
  
  <line x1="40" y1="1435" x2="380" y2="1435" stroke="#555"/>
  <text x="210" y="1460" text-anchor="middle" fill="#888" font-size="10">© 2026 DecodeLabs Full Stack Program. All rights reserved.</text>
</svg>
